<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henok Teklu</title>
  <meta name="description" content="Personal website of Henok Teklu — profile, interests, projects and certificates.">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" id="brand"></a>
      <nav id="nav-links" aria-label="Sections"></nav>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch color theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.800z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top"></section>
    <div id="sections"></div>
  </main>

  <footer class="wrap footer">
    <span id="footer-text"></span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <script src="data.js?v=14"></script>
  <script src="script.js?v=14"></script>
</body>
</html>
